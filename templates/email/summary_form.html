{% extends "base.html" %}
{% block title %}Enviar Resumen por Correo{% endblock %}
{% block content %}
<div class="mb-4">
    <h4 class="fw-bold mb-1"><i class="bi bi-envelope me-2"></i>Enviar Resumen por Correo</h4>
    <p class="text-secondary mb-0">Envíe un resumen del estado de pagos a los proveedores</p>
</div>
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Correo(s) destinatario(s)</label>
                        <input type="text" name="destinatarios" class="form-control" placeholder="email1@ejemplo.com, email2@ejemplo.com" required>
                        <div class="form-text">Separe múltiples correos con comas</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Proveedor (opcional)</label>
                        <select name="proveedor" class="form-select">
                            <option value="">Todos los proveedores</option>
                            {% for p in proveedores %}
                            <option value="{{ p.id }}">{{ p.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Incluir en el resumen</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="incluir_facturas" id="chk1" checked>
                            <label class="form-check-label" for="chk1">Facturas pendientes</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="incluir_conciliacion" id="chk2" checked>
                            <label class="form-check-label" for="chk2">Última conciliación</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="incluir_pagos" id="chk3">
                            <label class="form-check-label" for="chk3">Pagos recientes</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-send me-1"></i>Enviar Resumen
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
